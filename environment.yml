name: hcc-sempath
variables:
  PYTHONNOUSERSITE: "1"
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --pre
      - --extra-index-url=https://download.pytorch.org/whl/nightly/cpu
      - torch
      - torchvision
      - -e .
      - PyYAML
      - numpy
      - Pillow
      - tqdm
      - imagecodecs
      - pytest
      - timm
      - huggingface_hub
      - safetensors
      - openslide-python
      - openslide-bin
      - pyarrow
