[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-sempath"
version = "0.2.0.dev1"
description = "Lightweight vertical pathology representation model for HCC"
readme = "README.md"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "computational-pathology",
  "hepatocellular-carcinoma",
  "knowledge-distillation",
  "spatial-morphometry",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "torch",
  "torchvision",
  "timm",
  "PyYAML",
  "numpy",
  "matplotlib",
  "Pillow",
  "tqdm",
  "imagecodecs<2025.8.2; python_version < '3.11'",
  "imagecodecs; python_version >= '3.11'",
  "huggingface_hub",
  "safetensors",
  "openslide-python",
  "openslide-bin",
  "pyarrow",
  "iatro-base-iac>=0.1.3,<0.2",
  "iatro-iac-adapters>=0.1.3,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
search = [
  "optuna==4.9.0",
]

[project.scripts]
hcc-sempath = "hcc_sempath.cli.main:main"

[project.urls]
Homepage = "https://github.com/iatrode/iatro-hcc-sempath"
Repository = "https://github.com/iatrode/iatro-hcc-sempath"
Issues = "https://github.com/iatrode/iatro-hcc-sempath/issues"

[tool.setuptools.packages.find]
where = ["src"]
