[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-sempath"
version = "0.1.0"
description = "Lightweight vertical pathology representation model for HCC"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "torchvision",
  "timm",
  "PyYAML",
  "numpy",
  "matplotlib",
  "Pillow",
  "tqdm",
  "imagecodecs",
  "huggingface_hub",
  "safetensors",
  "openslide-python",
  "openslide-bin",
  "pyarrow",
  "iatro-base-iac>=0.1,<0.2",
  "iatro-iac-adapters>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
search = [
  "optuna",
]

[project.scripts]
hcc-sempath = "hcc_sempath.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
