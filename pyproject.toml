[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-sempath"
version = "0.2.0.dev2"
description = "Lightweight vertical pathology representation model for HCC"
readme = "README.md"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "computational-pathology",
  "hepatocellular-carcinoma",
  "knowledge-distillation",
  "spatial-morphometry",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "timm>=1.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "huggingface_hub>=0.30",
  "modelscope>=1.20",
  "safetensors>=0.5",
  "openslide-python>=1.4",
  "openslide-bin>=4.0.0.8",
  "pyarrow>=18.0",
  "scipy>=1.11",
  "iatro-base-iac>=0.1.3,<0.2",
  "iatro-iac-adapters>=0.1.3,<0.2",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "optuna>=4.9,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "tensorboard>=2.16",
]
[project.scripts]
hcc-sempath = "hcc_sempath.cli.main:main"

[project.urls]
Homepage = "https://github.com/iatrode/iatro-hcc-sempath"
Repository = "https://github.com/iatrode/iatro-hcc-sempath"
Issues = "https://github.com/iatrode/iatro-hcc-sempath/issues"

[tool.setuptools.packages.find]
where = ["src"]
