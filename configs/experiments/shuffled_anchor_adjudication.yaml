inherits: ../distill_train.example.yaml

data:
  prototype_supervision_manifest_path: data/prototypes/hcc_prototype_supervision_manifest.shuffled.csv

loss:
  feature_loss_type: cosine
  relation_weight: 0.05
  semantic_weight: 0.0
  zhcc_proto_weight: 0.2
  zhcc_proto_warmup_epochs: 3
  zhcc_level2_weight: 0.5
  prototype_filter_weight: 0.5
  prototype_filter_warmup_epochs: 3
  prototype_filter_alpha_min: 0.25
  consensus_weight: 0.4
  anchor_weight: 0.4
  zhcc_response_weight: 0.2
