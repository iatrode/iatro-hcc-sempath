inherits: train_tenth.example.yaml

runtime:
  output_dir: runtime/optuna_runs/manual_trial

data:
  # Replace these paths with the finalized, immutable train+val assets.
  prototype_supervision_manifest_path: /path/to/a0/hcc_prototype_supervision_manifest.csv
  prototype_supervision_train_splits: [train]
  prototype_supervision_val_splits: [val]
  spatial_manifest_path: /path/to/a0/hcc_spatial_annotations.json
  spatial_train_splits: [train]
  spatial_val_splits: [val]
  require_complete_expert_validation: true

train:
  # The first trial freezes T0/C0/S0 at the shared initialization. Every later
  # trial recomputes and verifies that baseline before reusing the exact stored
  # values. These weights are the stable center of the epoch-7 selection
  # region from the fixed 10% A0 trajectory; a later three-cell sensitivity
  # analysis changes only this prespecified selection rule.
  epochs: 16
  development_early_stop: false
  selection_early_stop: true
  selection_metric_weights:
    teacher: 0.26
    classification: 0.28
    spatial: 0.46
  # Start is derived from the last configured supervision-ramp end.
  selection_early_stop_patience: 3
  selection_early_stop_relative_delta: 0.005
  # Guarantees enough post-ramp epochs to observe a real plateau.
  selection_minimum_eligible_epochs: 8
  early_stop_teacher_alignment: false
  # The selected package-level 10% validation view is the source population.
  # Joint selection uses one unchanged 128-batch, label-blind population
  # validation probe (65,536 tiles at batch 512). This fixed large probe avoids
  # materializing all four teacher outputs for the complete 10% sampling frame
  # at every epoch. Relation MSE uses the deterministic evenly spaced 4,096-tile
  # subset configured below.
  max_val_batches: 128
  max_eval_batches: 128
  eval_pairwise_max_samples: 4096
