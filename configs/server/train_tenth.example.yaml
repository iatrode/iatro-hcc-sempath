inherits: train_full.example.yaml

runtime:
  output_dir: outputs/server_tenth

data:
  train_tile_fraction: 0.10
  val_tile_fraction: 0.10

# Only training duration is reduced. The full population stream, complete
# fixed classification/spatial expert union, LR warm-up, and expert-intervention schedule remain
# identical to the terminal configuration.
train:
  epochs: 20
  max_val_batches: 256
  max_eval_batches: 64
