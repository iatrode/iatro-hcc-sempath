runtime:
  device: cuda
  seed: 13
  output_dir: outputs/server_full

data:
  train_manifest_path: configs/server/manifest.example.yaml
  teachers: [gigapath, h_optimus_1, uni2_h, virchow2]
  prototype_paths:
    gigapath: /path/to/prototypes/gigapath_hcc_semantic_prototypes.pt
    h_optimus_1: /path/to/prototypes/h_optimus_1_hcc_semantic_prototypes.pt
    uni2_h: /path/to/prototypes/uni2_h_hcc_semantic_prototypes.pt
    virchow2: /path/to/prototypes/virchow2_hcc_semantic_prototypes.pt
  prototype_supervision_manifest_path: /path/to/prototypes/hcc_prototype_supervision_manifest.csv
  prototype_supervision_train_splits: [train]
  prototype_supervision_val_splits: [val]
  # Spatial JSON/JSONL supports point, brush, circle, and polygon geometries.
  spatial_manifest_path: /path/to/prototypes/hcc_spatial_annotations.json
  spatial_train_splits: [train]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  dynamic_package_sampling: true
  tensor_collate: true
  package_chunk_size: 64
  # Replay the fixed classification/spatial expert tiles throughout population distillation.
  expert_replay_interval_batches: 16
  expert_batch_size: 64

model:
  embedding_dim: 1536
  projector_type: linear
  projector_hidden_dim: 2048
  teacher_head_type: linear
  teacher_dims:
    gigapath: 1536
    h_optimus_1: 1536
    uni2_h: 1536
    virchow2: 2560
  classification_class_names:
    [HCC-tumor-well-differentiated, HCC-tumor-moderately-differentiated,
     HCC-tumor-poorly-differentiated, Background-liver,
     Inflammatory-stromal, Degenerative-material]
  spatial_dim: 256
  spatial_output_stride: 7

loss:
  teacher_weights:
    gigapath: 1.0
    h_optimus_1: 1.0
    uni2_h: 1.0
    virchow2: 1.0
  feature_loss_type: cosine
  relation_weight: 0.05
  semantic_weight: 0.02
  semantic_temperature: 1.0
  classification_temperature: 1.0
  # Teacher-only representation shaping precedes all expert supervision.
  # Classification and spatial supervision then enter together and ramp on the same global-step clock.
  expert_supervision_start_step: 3000
  expert_supervision_ramp_steps: 1000
  # PAMT-D teacher adjudication and dynamic student-prototype response.
  pamtd_classification_temperature: 0.1
  prototype_filter_weight: 0.5
  prototype_filter_alpha_min: 0.25
  prototype_filter_start_step: 4000
  prototype_filter_ramp_steps: 1000
  prototype_consensus_weight: 0.4
  prototype_label_weight: 0.4
  prototype_student_weight: 0.2
  zhcc_response_weight: 0.15
  zhcc_response_start_step: 4000
  zhcc_response_ramp_steps: 1000
  spatial_global_temperature: 0.1
  classification_weight: 1.0
  spatial_weight: 0.1
  spatial_point_tolerance_cells: 1
  spatial_abundance_point_weight: 0.5
  spatial_brush_weight: 1.0
  spatial_brush_top_fraction: 0.25
  spatial_explicit_negative_weight: 1.0
  spatial_implicit_negative_weight: 0.05
  # Default training always feeds both expert objectives back into zhcc.
  # The detached setting exists only for the matched A8 mechanism ablation.
  spatial_detach_shared_encoder: false

train:
  batch_size: 512
  compile: true
  fused_optimizer: true
  fused_image_prepare: true
  epochs: 100
  lr: 0.0001
  scheduler: cosine
  lr_warmup_steps: 1000
  min_lr: 0.000001
  weight_decay: 0.01
  max_grad_norm: 1.0
  amp: true
  topk: 10
  max_val_batches: 512
  max_eval_batches: 128
  log_interval: 0
  progress: tqdm
  tensorboard: true
  tensorboard_batch_interval: 20
  # Every optimizer step is retained in a buffered append-only CSV. The fixed
  # development probe supplies intra-epoch loss curves on an unchanged subset.
  step_metrics_flush_steps: 50
  # Atomic, exactly resumable mid-epoch checkpoint. Full-corpus epochs are too
  # long to use epoch boundaries as the only recovery point.
  checkpoint_interval_steps: 1000
  development_probe_interval_steps: 1000
  development_probe_batches: 64
  # Re-encode the complete fixed expert banks in the evolving student.
  # Batch sizes are compute chunks only; every refresh uses every bank tile.
  dynamic_prototype_refresh_steps: 500
  dynamic_prototype_batch_size: 512
  dynamic_spatial_prototype_refresh_steps: 500
  # Spatial selection is frozen after training on an independent validation
  # asset; teacher-alignment plateaus must not terminate spatial learning.
  early_stop_teacher_alignment: false
