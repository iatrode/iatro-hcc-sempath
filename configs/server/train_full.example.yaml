runtime:
  device: cuda
  seed: 13
  output_dir: outputs/server_full

data:
  train_manifest_path: configs/server/manifest.example.yaml
  teachers: [gigapath, h_optimus_1, uni2_h, virchow2]
  prototype_paths:
    gigapath: /path/to/prototypes/gigapath_hcc_semantic_prototypes.pt
    h_optimus_1: /path/to/prototypes/h_optimus_1_hcc_semantic_prototypes.pt
    uni2_h: /path/to/prototypes/uni2_h_hcc_semantic_prototypes.pt
    virchow2: /path/to/prototypes/virchow2_hcc_semantic_prototypes.pt
  zhcc_prototype_image_path: /path/to/prototypes/zhcc_hcc_prototype_images.pt
  prototype_supervision_manifest_path: /path/to/prototypes/hcc_prototype_supervision_manifest.csv
  prototype_supervision_train_splits: [train]
  prototype_supervision_val_splits: [val]
  # ROI JSON/JSONL supports point, brush, circle, and polygon geometries.
  # roi_manifest_path: /path/to/prototypes/hcc_l2_roi_annotations.json
  roi_train_splits: [train]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  dynamic_package_sampling: true
  tensor_collate: true
  package_chunk_size: 64

model:
  backbone_name: vit_small_patch16_224
  embedding_dim: 1536
  projector_type: linear
  projector_hidden_dim: 2048
  teacher_head_type: linear
  teacher_dims:
    gigapath: 1536
    h_optimus_1: 1536
    uni2_h: 1536
    virchow2: 2560
  pretrained: false
  roi_patch_size: 16
  roi_patch_dim: 1536
  roi_top_q: 0.1
  roi_patch_temperature: 0.1

loss:
  teacher_weights:
    gigapath: 1.0
    h_optimus_1: 1.0
    uni2_h: 1.0
    virchow2: 1.0
  feature_loss_type: cosine
  relation_weight: 0.05
  scale_relation_by_alpha: true
  semantic_weight: 0.02
  semantic_temperature: 1.0
  primary_temperature: 1.0
  attribute_temperature: 1.0
  zhcc_primary_temperature: 0.1
  zhcc_attribute_temperature: 0.1
  zhcc_proto_weight: 0.2
  zhcc_level2_weight: 0.5
  prototype_filter_weight: 0.5
  prototype_filter_alpha_min: 0.25
  consensus_weight: 0.4
  prototype_label_weight: 0.4
  prototype_l1_agreement_weight: 0.5
  prototype_l2_agreement_weight: 0.5
  zhcc_response_weight: 0.15
  roi_weight: 0.1
  roi_consistency_weight: 0.05
  roi_start_step: 0
  roi_ramp_steps: 1000
  roi_backbone_start_step: 1000
  roi_consistency_start_step: 1000
  teacher_prior_plateau_window_steps: 1000
  teacher_prior_plateau_threshold: 0.01
  teacher_prior_plateau_patience: 2
  teacher_prior_ema_beta: 0.9
  min_teacher_warmup_steps: 2000
  max_teacher_warmup_steps: 10000
  prototype_ramp_steps: 1000
  filter_ramp_steps: 1000
  proto_to_filter_delay_steps: 1000

train:
  batch_size: 512
  epochs: 100
  lr: 0.0001
  scheduler: cosine
  warmup_epochs: 3
  min_lr: 0.000001
  weight_decay: 0.01
  max_grad_norm: 1.0
  amp: true
  topk: 10
  max_val_batches: 512
  max_eval_batches: 128
  dynamic_prototype_batch_size: 512
  scientific_score_zhcc_response_weight: 0.25
  log_interval: 0
  progress: tqdm
  tensorboard: true
  tensorboard_batch_interval: 20
