runtime:
  device: cpu
  seed: 13
  output_dir: outputs/smoke/package_run

data:
  image_tile_package_path: outputs/smoke/fixture/tiles.iac
  teacher_feature_package_path: outputs/smoke/fixture/smoke.features.iac
  prototype_path: outputs/smoke/fixture/prototypes.pt
  num_workers: 0

model:
  teacher_dim: 256

loss:
  feature_loss_type: cosine
  relation_weight: 0.25
  semantic_weight: 0.0
  semantic_warmup_epochs: 0
  semantic_temperature: 1.0
  l1_weight: 1.0
  spatial_weight: 0.1

train:
  batch_size: 2
  epochs: 2
  lr: 0.0001
  weight_decay: 0.01
  amp: false
  topk: 2
  max_val_batches: 1
  max_eval_batches: 1
