runtime:
  device: cuda
  seed: 13
  output_dir: outputs/hcc_sempath_v1

data:
  train_manifest_path: data/manifests/hcc_train.yaml
  feature_root: data/features
  teachers: [h_optimus_1, gigapath]
  prototype_paths:
    h_optimus_1: data/prototypes/h_optimus_1_hcc_semantic_prototypes.pt
    gigapath: data/prototypes/gigapath_hcc_semantic_prototypes.pt
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true

model:
  backbone_name: vit_small_patch14_dinov2.lvd142m
  embedding_dim: 1536
  teacher_dims:
    h_optimus_1: 1536
    gigapath: 1536
  pretrained: true

loss:
  teacher_weights:
    h_optimus_1: 1.0
    gigapath: 1.0
  relation_weight: 0.25
  semantic_weight: 0.25
  semantic_temperature: 1.0

train:
  batch_size: 256
  epochs: 100
  lr: 0.0001
  weight_decay: 0.01
  amp: true
  topk: 10
