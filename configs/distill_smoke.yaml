runtime:
  device: cpu
  seed: 13
  output_dir: outputs/smoke

data:
  image_tile_package_path: smoke_data/tiles.iac
  teacher_feature_package_path: smoke_data/smoke.features.iac
  prototype_path: smoke_data/prototypes.pt
  num_workers: 0

model:
  backbone_name: vit_tiny_patch16_224
  teacher_dim: 256
  pretrained: false

loss:
  feature_loss_type: cosine
  relation_weight: 0.25
  semantic_weight: 0.0
  semantic_warmup_epochs: 0
  semantic_temperature: 1.0
  prototype_filter_weight: 0.0
  prototype_filter_warmup_epochs: 0
  prototype_filter_alpha_min: 0.25
  zhcc_proto_weight: 0.0
  zhcc_level2_weight: 0.5

train:
  batch_size: 2
  epochs: 2
  lr: 0.0001
  weight_decay: 0.01
  amp: false
  topk: 2
  max_val_batches: 1
  max_eval_batches: 1
