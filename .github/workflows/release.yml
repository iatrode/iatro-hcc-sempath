name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 0.2.0.dev2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  preflight:
    name: Validate v${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate release metadata and PyPI availability
        run: |
          python -m pip install --upgrade packaging
          python scripts/check_release.py source \
            --version "${{ inputs.version }}" \
            --tag "${{ env.RELEASE_TAG }}" \
            --check-pypi

      - name: Install HCC-SemPath and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release tests
        run: |
          python -m ruff check .
          git ls-files '*.sh' | xargs -r -n1 bash -n
          python -m pytest -q

  distributions:
    name: Build distributions
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build packaging twine
          python -m build --outdir dist
          python -m twine check dist/*
          python scripts/check_release.py dist \
            --version "${{ inputs.version }}" \
            --directory dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-hcc-sempath-v${{ inputs.version }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish HCC-SemPath to PyPI
    needs: distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-hcc-sempath-v${{ inputs.version }}
          path: dist

      - name: Upload HCC-SemPath distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.HCC_SEMPATH_PYPI_TOKEN }}

  publish-github-release:
    name: Publish GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-hcc-sempath-v${{ inputs.version }}
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${{ inputs.version }}" in
            *a*|*b*|*rc*|*.dev*) prerelease=(--prerelease) ;;
          esac
          gh release create "${{ env.RELEASE_TAG }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes \
            "${prerelease[@]}"
