name: CI

on:
  push:
    branches: [main, develop-v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check shell entrypoints
        run: |
          bash -n scripts/run_autodl_training.sh
          bash -n experiments/ablation/scripts/run_ablations.sh
      - name: Test
        run: python -m pytest -q
