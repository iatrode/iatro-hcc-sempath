# Shared reduced-duration ablation overlay.
#
# "One-tenth" refers to training duration, not cohort sampling. Every condition
# consumes the full population stream and the complete fixed L1/L2 expert union
# so the gradient comparison is not confounded by a changed cohort.

data:
  train_tile_fraction: 1.0
  val_tile_fraction: 1.0

train:
  max_val_batches: 256
  max_eval_batches: 64
