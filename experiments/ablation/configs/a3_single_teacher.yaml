inherits: matched_tenth.yaml

# Ablation A3 — single-teacher student distillation without the global HCC
# prototype coordinate or classification supervision; matched spatial supervision
# remains active.
# Design doc §7 item 3.
#
# Single conceptual change vs A1: only one teacher is distilled. Combined with
# no global prototype supervision, this is the single-teacher reference.
# Teacher choice is frozen to virchow2 for the matched A3/A4 contrast. It is a
# design constant for the matched comparison.
#
# Teacher-keyed mappings use replacement semantics, so this file states the
# complete single-teacher set.

runtime:
  output_dir: outputs/experiments/ablation/a3_single_teacher

data:
  teachers: [virchow2]
  prototype_paths: null

model:
  teacher_dims:
    virchow2: 2560

loss:
  teacher_weights:
    virchow2: 1.0
  classification_weight: 0.0
  semantic_weight: 0.0
  zhcc_response_weight: 0.0
  prototype_filter_weight: 0.0
