inherits: matched_tenth.yaml

# Ablation A4 — HCC prototype supervision WITHOUT multi-teacher distillation.
# Design doc §7 item 6.
#
# Single variable vs A0: only one teacher is used, but all prototype supervision
# AND adjudication are retained. This isolates the contribution of the
# multi-teacher ensemble: same prototype shaping, while the cross-teacher
# consensus coordinate is neutral for a single active teacher. Reliability is
# therefore driven by expert-label and student-response agreement.
#
# Contrast map:
#   A0 = multi-teacher + prototype           (full)
#   A3 = single-teacher, no prototype        (floor)
#   A4 = single-teacher + prototype          (this) -> A0 vs A4 = multi-teacher gain
#
# Teacher: virchow2 (same choice as A3 for a clean A3/A4 pair).
#
# Teacher-keyed mappings use replacement semantics, so this file states the
# complete single-teacher set and its matching prototype registry.

runtime:
  output_dir: outputs/experiments/ablation/a4_single_teacher_prototype

data:
  teachers: [virchow2]
  prototype_paths:
    virchow2: artifacts/prototypes/virchow2_hcc_semantic_prototypes.pt

model:
  teacher_dims:
    virchow2: 2560

loss:
  teacher_weights:
    virchow2: 1.0
