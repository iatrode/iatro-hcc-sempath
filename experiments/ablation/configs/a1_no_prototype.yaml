inherits: matched_tenth.yaml

# Ablation A1 — multi-teacher distillation without the global HCC prototype
# coordinate or classification supervision. The matched spatial task remains active.
# Design doc §7 item 4.
#
# Mechanism removal vs A0: classification targets and prototype-response objectives are
# turned off. The same classification expert tile images remain in the fixed replay union,
# but their classification labels are masked so image distribution and replay frequency
# remain matched. This removes classification target loss, prototype-coordinate semantic
# distillation, PAMT-D reliability adjudication, and student response matching
# together; four-teacher feature/relation distillation and spatial
# supervision, including its local prototype readout, remain active.
#
# Prototype coordinates are explicitly nulled and the classification training
# loss is zeroed. The classification manifest remains available both to retain
# the matched replay images and to evaluate the unchanged complete L1
# validation term used for checkpoint selection.

runtime:
  output_dir: outputs/experiments/ablation/a1_no_prototype

data:
  prototype_paths: null

loss:
  classification_weight: 0.0
  semantic_weight: 0.0
  zhcc_response_weight: 0.0
  prototype_filter_weight: 0.0
