inherits: matched_tenth.yaml

# Ablation A1 — multi-teacher distillation without the global HCC prototype
# coordinate or L1 supervision. The matched L2 spatial task remains active.
# Design doc §7 item 4.
#
# Mechanism removal vs A0: L1 targets and prototype-response objectives are
# turned off. The same L1 expert tile images remain in the fixed replay union,
# but their L1 labels are masked so image distribution and replay frequency
# remain matched. This removes L1 target loss, prototype-coordinate semantic
# distillation, PAMT-D reliability adjudication, and student response matching
# together; four-teacher feature/relation distillation and spatial L2
# supervision, including its local prototype readout, remain active.
#
# Active prototype paths and the L1 target manifest are explicitly nulled. The
# resolver retains the separate replay-selection manifest solely for matched
# tile sampling.

runtime:
  output_dir: outputs/experiments/ablation/a1_no_prototype

data:
  prototype_paths: null
  prototype_supervision_manifest_path: null

loss:
  semantic_weight: 0.0
  zhcc_response_weight: 0.0
  prototype_filter_weight: 0.0
