inherits: ../../../artifacts/models/hcc-sempath-full/resolved_config.json

runtime:
  device: mps
  seed: 13
  output_dir: experiments/00_local_eval/results

data:
  train_manifest_path: configs/local/mac/manifest.yaml
  prototype_paths:
    gigapath: artifacts/prototypes/gigapath_hcc_semantic_prototypes.pt
    h_optimus_1: artifacts/prototypes/h_optimus_1_hcc_semantic_prototypes.pt
    uni2_h: artifacts/prototypes/uni2_h_hcc_semantic_prototypes.pt
    virchow2: artifacts/prototypes/virchow2_hcc_semantic_prototypes.pt
  zhcc_prototype_image_path: artifacts/prototypes/zhcc_hcc_prototype_images.pt
  prototype_supervision_manifest_path: artifacts/prototypes/hcc_prototype_supervision_manifest.csv
  num_workers: 0
  persistent_workers: false
  dynamic_package_sampling: false
  tensor_collate: false
  val_tile_fraction: 0.001
  exval_tile_fraction: 0.001

model:
  grad_checkpointing: false

train:
  batch_size: 16
  amp: false
  max_eval_batches: 4
  max_val_batches: 4
  eval_pairwise_max_samples: 512
  progress: none
  tensorboard: false
  batch_profile_csv: false
  system_profile_interval: 0
